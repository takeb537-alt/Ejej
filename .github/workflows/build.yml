name: EasyLoan Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Flutter version check
        run: flutter --version

      - name: Create fresh Flutter project
        run: |
          cd /tmp
          flutter create --project-name easy_loan --platforms android fresh_app
          echo "✅ Fresh project created"

      - name: Copy lib folder
        run: |
          rm -rf /tmp/fresh_app/lib
          cp -r $GITHUB_WORKSPACE/lib /tmp/fresh_app/lib
          echo "✅ lib copied"

      - name: Copy pubspec.yaml
        run: |
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/fresh_app/pubspec.yaml
          echo "✅ pubspec copied"

      - name: Copy assets if exist
        run: |
          if [ -d "$GITHUB_WORKSPACE/assets" ]; then
            cp -r $GITHUB_WORKSPACE/assets /tmp/fresh_app/assets
            echo "✅ assets copied"
          else
            echo "ℹ️ No assets folder"
          fi

      - name: Fix pubspec name
        working-directory: /tmp/fresh_app
        run: |
          sed -i 's/^name:.*/name: easy_loan/' pubspec.yaml
          cat pubspec.yaml | head -5
          echo "✅ pubspec name fixed"

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "✅ Licenses accepted"

      - name: Get dependencies
        working-directory: /tmp/fresh_app
        run: |
          flutter pub get
          echo "✅ Dependencies ready"

      - name: Fix Dart errors check
        working-directory: /tmp/fresh_app
        run: |
          flutter analyze --no-fatal-infos || true
          echo "✅ Analyze done"

      - name: Build APK
        working-directory: /tmp/fresh_app
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --no-shrink \
            2>&1 | tee build_log.txt
          echo "✅ APK Built!"

      - name: Show APK info
        working-directory: /tmp/fresh_app
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "✅ APK ready"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyLoan-release-apk
          path: /tmp/fresh_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: /tmp/fresh_app/build_log.txt
          retention-days: 7