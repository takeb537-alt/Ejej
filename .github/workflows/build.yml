name: EasyLoan Build APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Hardened Build Process
        run: |
          # 1. Pubspec name fix
          sed -i 's/name: .*/name: easy_loan/' pubspec.yaml
          
          # 2. Sirf android files generate karo, lib folder ko touch mat karo
          if [ ! -d "android" ]; then
            flutter create . --platforms android --project-name easy_loan
          fi
          
          # 3. Build APK (Isse counter app nahi banega)
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyLoan-Final-Success
          path: build/app/outputs/flutter-apk/app-release.apk
