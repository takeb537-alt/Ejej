name: EasyLoan Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create fresh Flutter project
        run: |
          flutter create \
            --project-name easy_loan \
            --platforms android \
            /tmp/fresh_app

      - name: Copy lib folder
        run: |
          rm -rf /tmp/fresh_app/lib
          cp -r $GITHUB_WORKSPACE/lib /tmp/fresh_app/lib

      - name: Copy pubspec.yaml
        run: |
          cp $GITHUB_WORKSPACE/pubspec.yaml /tmp/fresh_app/pubspec.yaml

      - name: Fix pubspec name to easy_loan
        run: |
          sed -i 's/^name:.*/name: easy_loan/' /tmp/fresh_app/pubspec.yaml

      - name: Copy assets if exist
        run: |
          if [ -d "$GITHUB_WORKSPACE/assets" ]; then
            cp -r $GITHUB_WORKSPACE/assets /tmp/fresh_app/assets
          fi

      - name: Fix android/app/build.gradle
        run: |
          cat > /tmp/fresh_app/android/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.example.easy_loan"
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.easy_loan"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source "../.."
          }
          EOF

      - name: Get dependencies
        working-directory: /tmp/fresh_app
        run: flutter pub get

      - name: Build release APK
        working-directory: /tmp/fresh_app
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Verify APK exists
        run: |
          APK_PATH="/tmp/fresh_app/build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APK ready! Size: $SIZE"
          else
            echo "❌ APK not found!"
            find /tmp/fresh_app/build -name "*.apk" 2>/dev/null || echo "No APK anywhere"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyLoan-APK
          path: /tmp/fresh_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload error log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: |
            /tmp/fresh_app/build_log.txt
          retention-days: 7