name: EasyLoan Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Create fresh project
        run: |
          flutter create --project-name easy_loan --platforms android /tmp/easy_loan

      - name: Write main.dart
        run: |
          cat > /tmp/easy_loan/lib/main.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'screens/splash_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.dark,
              ),
            );
            runApp(const EasyLoanApp());
          }

          class EasyLoanApp extends StatelessWidget {
            const EasyLoanApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'EasyLoan',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF4A9B8E)),
                  useMaterial3: true,
                ),
                home: const SplashScreen(),
              );
            }
          }
          DARTEOF

      - name: Create screens directory
        run: mkdir -p /tmp/easy_loan/lib/screens

      - name: Write splash_screen.dart
        run: |
          cat > /tmp/easy_loan/lib/screens/splash_screen.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'home_screen.dart';

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> with SingleTickerProviderStateMixin {
            late AnimationController _controller;
            late Animation<double> _fadeAnim;
            late Animation<double> _scaleAnim;

            @override
            void initState() {
              super.initState();
              _controller = AnimationController(vsync: this, duration: const Duration(milliseconds: 1200));
              _fadeAnim = Tween<double>(begin: 0, end: 1).animate(CurvedAnimation(parent: _controller, curve: Curves.easeIn));
              _scaleAnim = Tween<double>(begin: 0.8, end: 1).animate(CurvedAnimation(parent: _controller, curve: Curves.elasticOut));
              _controller.forward();
              Future.delayed(const Duration(seconds: 3), () {
                if (mounted) {
                  Navigator.pushReplacement(context, PageRouteBuilder(
                    pageBuilder: (_, __, ___) => const HomeScreen(),
                    transitionsBuilder: (_, anim, __, child) => FadeTransition(opacity: anim, child: child),
                    transitionDuration: const Duration(milliseconds: 500),
                  ));
                }
              });
            }

            @override
            void dispose() { _controller.dispose(); super.dispose(); }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF0F2F5),
                body: Center(
                  child: FadeTransition(
                    opacity: _fadeAnim,
                    child: ScaleTransition(
                      scale: _scaleAnim,
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Stack(
                            alignment: Alignment.center,
                            children: [
                              Container(width: 90, height: 90, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: const Color(0xFFB0C4DE), width: 2.5))),
                              Container(width: 75, height: 75, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: const Color(0xFFB0E0E6), width: 2.5))),
                              Container(width: 60, height: 60, decoration: BoxDecoration(shape: BoxShape.circle, border: Border.all(color: const Color(0xFFDDA0DD), width: 2.5))),
                              Container(width: 48, height: 48, decoration: BoxDecoration(shape: BoxShape.circle, color: const Color(0xFF4A9B8E).withOpacity(0.15), border: Border.all(color: const Color(0xFF1B3A6B), width: 2)), child: const Icon(Icons.person, size: 28, color: Color(0xFF4A9B8E))),
                            ],
                          ),
                          const SizedBox(height: 20),
                          RichText(text: const TextSpan(children: [
                            TextSpan(text: 'Easy', style: TextStyle(fontSize: 36, fontWeight: FontWeight.bold, color: Color(0xFF1B3A6B))),
                            TextSpan(text: 'Loan', style: TextStyle(fontSize: 36, fontWeight: FontWeight.bold, color: Color(0xFF4A9B8E))),
                          ])),
                          const SizedBox(height: 8),
                          const Text('Your Categories, Your Amount.', style: TextStyle(fontSize: 15, color: Color(0xFF6B7280))),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          DARTEOF

      - name: Write home_screen.dart
        run: |
          cat > /tmp/easy_loan/lib/screens/home_screen.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'loan_details_screen.dart';
          import 'loan_categories_screen.dart';
          import 'profile_screen.dart';
          import 'drawer_menu.dart';

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int _currentIndex = 0;
            double _loanAmount = 1000;
            bool _drawerOpen = false;

            final List<Map<String, dynamic>> _loanCards = [
              {'label': 'Personal Loan', 'amount': '100', 'color': Color(0xFFDBEAFF), 'icon': Icons.monetization_on_outlined},
              {'label': 'Personal Loan', 'amount': '500', 'color': Color(0xFFD0F0EC), 'icon': Icons.savings_outlined},
              {'label': 'Personal Loan', 'amount': '1000', 'color': Color(0xFFDCF5E4), 'icon': Icons.account_balance_wallet_outlined},
              {'label': 'Personal Loan', 'amount': '2000', 'color': Color(0xFFFFF3D0), 'icon': Icons.payments_outlined},
            ];

            final List<Map<String, dynamic>> _categories = [
              {'label': 'Medical', 'icon': Icons.local_hospital_outlined, 'color': Color(0xFFDBEAFF)},
              {'label': 'Education', 'icon': Icons.school_outlined, 'color': Color(0xFFD0F0EC)},
              {'label': 'Travel', 'icon': Icons.flight_outlined, 'color': Color(0xFFFFE4E6)},
              {'label': 'Business', 'icon': Icons.business_center_outlined, 'color': Color(0xFFFFF3D0)},
              {'label': 'Vehicle', 'icon': Icons.directions_car_outlined, 'color': Color(0xFFEDE9FE)},
              {'label': 'Home', 'icon': Icons.home_outlined, 'color': Color(0xFFFFEDD5)},
            ];

            Widget _getBody() {
              switch (_currentIndex) {
                case 1: return const LoanCategoriesScreen(isTab: true);
                case 2: return const ProfileScreen(isTab: true);
                default: return _buildHomeContent();
              }
            }

            @override
            Widget build(BuildContext context) {
              return Stack(
                children: [
                  Scaffold(
                    backgroundColor: const Color(0xFFF5F6FA),
                    body: SafeArea(child: _getBody()),
                    bottomNavigationBar: _buildBottomNav(),
                  ),
                  if (_drawerOpen) AppDrawer(onClose: () => setState(() => _drawerOpen = false)),
                ],
              );
            }

            Widget _buildHomeContent() {
              return SingleChildScrollView(
                padding: const EdgeInsets.symmetric(horizontal: 16),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const SizedBox(height: 12),
                    _buildTopBar(),
                    const SizedBox(height: 20),
                    const Center(child: Text('EasyLoan', style: TextStyle(fontSize: 30, fontWeight: FontWeight.bold, color: Color(0xFF1A1A2E)))),
                    const SizedBox(height: 20),
                    _buildLoanGrid(),
                    const SizedBox(height: 24),
                    _buildSectionHeader('Loan Categories', onSwipe: () => setState(() => _currentIndex = 1)),
                    const SizedBox(height: 12),
                    _buildCategoriesRow(),
                    const SizedBox(height: 24),
                    _buildAmountSlider(),
                    const SizedBox(height: 24),
                    _buildGetStartedButton(),
                    const SizedBox(height: 24),
                  ],
                ),
              );
            }

            Widget _buildTopBar() {
              return Row(
                children: [
                  GestureDetector(
                    onTap: () => setState(() => _drawerOpen = true),
                    child: Container(width: 40, height: 40, decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(10), boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.05), blurRadius: 6)]), child: const Icon(Icons.menu, color: Color(0xFF1A1A2E), size: 22)),
                  ),
                  const SizedBox(width: 10),
                  Expanded(child: Container(height: 42, decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(24)), child: const Row(children: [SizedBox(width: 14), Icon(Icons.search, color: Color(0xFF9CA3AF), size: 18), SizedBox(width: 8), Text('Search', style: TextStyle(color: Color(0xFF9CA3AF), fontSize: 14))]))),
                  const SizedBox(width: 10),
                  GestureDetector(onTap: () => setState(() => _currentIndex = 2), child: Container(width: 40, height: 40, decoration: BoxDecoration(shape: BoxShape.circle, color: const Color(0xFFFFE0B2), border: Border.all(color: const Color(0xFFFFCC80), width: 2)), child: const Icon(Icons.person, color: Color(0xFF4A9B8E), size: 22))),
                ],
              );
            }

            Widget _buildLoanGrid() {
              return GridView.builder(
                shrinkWrap: true,
                physics: const NeverScrollableScrollPhysics(),
                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 2, crossAxisSpacing: 12, mainAxisSpacing: 12, childAspectRatio: 1.4),
                itemCount: _loanCards.length,
                itemBuilder: (context, index) {
                  final card = _loanCards[index];
                  return GestureDetector(
                    onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => LoanDetailsScreen(amount: card['amount'] as String, color: card['color'] as Color))),
                    child: Container(
                      decoration: BoxDecoration(color: card['color'] as Color, borderRadius: BorderRadius.circular(16)),
                      padding: const EdgeInsets.all(14),
                      child: Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                        Text(card['label'] as String, style: const TextStyle(fontSize: 12, color: Color(0xFF4B5563), fontWeight: FontWeight.w500)),
                        Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                          Text('₹${card['amount']}', style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: Color(0xFF1A1A2E))),
                          Icon(card['icon'] as IconData, size: 22, color: const Color(0xFF6B7280)),
                        ]),
                      ]),
                    ),
                  );
                },
              );
            }

            Widget _buildSectionHeader(String title, {VoidCallback? onSwipe}) {
              return Row(
                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                children: [
                  Text(title, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF1A1A2E))),
                  if (onSwipe != null) GestureDetector(onTap: onSwipe, child: const Row(children: [Text('Swipe', style: TextStyle(fontSize: 13, color: Color(0xFF9CA3AF))), Icon(Icons.chevron_right, size: 18, color: Color(0xFF9CA3AF))])),
                ],
              );
            }

            Widget _buildCategoriesRow() {
              return SizedBox(
                height: 88,
                child: ListView.separated(
                  scrollDirection: Axis.horizontal,
                  itemCount: _categories.length,
                  separatorBuilder: (_, __) => const SizedBox(width: 10),
                  itemBuilder: (context, index) {
                    final cat = _categories[index];
                    return GestureDetector(
                      onTap: () => setState(() => _currentIndex = 1),
                      child: Column(children: [
                        Container(width: 58, height: 58, decoration: BoxDecoration(color: cat['color'] as Color, borderRadius: BorderRadius.circular(14)), child: Icon(cat['icon'] as IconData, size: 26, color: const Color(0xFF4A9B8E))),
                        const SizedBox(height: 5),
                        Text(cat['label'] as String, style: const TextStyle(fontSize: 11, color: Color(0xFF4B5563))),
                      ]),
                    );
                  },
                ),
              );
            }

            Widget _buildAmountSlider() {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text('Choose Your Amount', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Color(0xFF1A1A2E))),
                  const SizedBox(height: 24),
                  Stack(clipBehavior: Clip.none, children: [
                    SliderTheme(
                      data: SliderThemeData(activeTrackColor: const Color(0xFF4A9B8E), inactiveTrackColor: const Color(0xFFE5E7EB), thumbColor: Colors.white, thumbShape: const RoundSliderThumbShape(enabledThumbRadius: 10), trackHeight: 5, overlayColor: const Color(0xFF4A9B8E).withOpacity(0.15)),
                      child: Slider(value: _loanAmount, min: 100, max: 2000, divisions: 19, onChanged: (val) => setState(() => _loanAmount = val)),
                    ),
                    Positioned(
                      left: ((_loanAmount - 100) / 1900) * (MediaQuery.of(context).size.width - 64) - 22,
                      top: -32,
                      child: Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4), decoration: BoxDecoration(color: const Color(0xFF4A9B8E), borderRadius: BorderRadius.circular(8)), child: Text('₹${_loanAmount.toInt()}', style: const TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.bold))),
                    ),
                  ]),
                  const SizedBox(height: 4),
                  const Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                    Text('₹100', style: TextStyle(fontSize: 11, color: Color(0xFF9CA3AF))),
                    Text('₹1000', style: TextStyle(fontSize: 11, color: Color(0xFF9CA3AF))),
                    Text('₹2000', style: TextStyle(fontSize: 11, color: Color(0xFF9CA3AF))),
                  ]),
                ],
              );
            }

            Widget _buildGetStartedButton() {
              return SizedBox(
                width: double.infinity, height: 52,
                child: ElevatedButton(
                  onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => LoanDetailsScreen(amount: '${_loanAmount.toInt()}', color: const Color(0xFFD0F0EC)))),
                  style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF4A9B8E), foregroundColor: Colors.white, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(28)), elevation: 0),
                  child: const Text('Get Started', style: TextStyle(fontSize: 16, fontWeight: FontWeight.w600)),
                ),
              );
            }

            Widget _buildBottomNav() {
              return Container(
                decoration: BoxDecoration(color: Colors.white, boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.07), blurRadius: 12, offset: const Offset(0, -2))]),
                child: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  onTap: (i) => setState(() => _currentIndex = i),
                  backgroundColor: Colors.white,
                  selectedItemColor: const Color(0xFF4A9B8E),
                  unselectedItemColor: const Color(0xFF9CA3AF),
                  elevation: 0,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.home_outlined), activeIcon: Icon(Icons.home), label: 'Home'),
                    BottomNavigationBarItem(icon: Icon(Icons.grid_view_outlined), activeIcon: Icon(Icons.grid_view), label: 'Categories'),
                    BottomNavigationBarItem(icon: Icon(Icons.person_outline), activeIcon: Icon(Icons.person), label: 'Profile'),
                  ],
                ),
              );
            }
          }
          DARTEOF

      - name: Write loan_details_screen.dart
        run: |
          cat > /tmp/easy_loan/lib/screens/loan_details_screen.dart << 'DARTEOF'
          import 'package:flutter/material.dart';

          class LoanDetailsScreen extends StatefulWidget {
            final String amount;
            final Color color;
            final String? category;
            const LoanDetailsScreen({super.key, required this.amount, required this.color, this.category});
            @override
            State<LoanDetailsScreen> createState() => _LoanDetailsScreenState();
          }

          class _LoanDetailsScreenState extends State<LoanDetailsScreen> {
            bool _agreed = true;

            double get _principal => double.tryParse(widget.amount.replaceAll(',', '')) ?? 100;
            double get _totalPayable => _principal * 1.075;
            double get _emi => _totalPayable / 12;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF5F6FA),
                body: SafeArea(
                  child: Column(children: [
                    Padding(
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 8),
                      child: Row(children: [
                        IconButton(icon: const Icon(Icons.