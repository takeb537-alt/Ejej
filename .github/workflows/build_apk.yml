name: Build Professional APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Clean and Create Android
        # '--force' use karenge taaki interactive mode na aaye
        run: |
          rm -rf android
          flutter create . --platforms android --force

      - name: Get Packages
        run: flutter pub get

      - name: Build Debug APK
        # '--no-pub' use karenge kyunki hum pehle hi get kar chuke hain
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Professional-EasyLoan-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
