name: medicine_reminder
description: A simple offline medicine reminder app for elderly Indian users.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.5
  
  # 🟢 Databases
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  
  # 🟢 Audio (Versions locked to avoid conflicts)
  record: ^5.1.0
  audioplayers: ^5.2.1
  
  # 🟢 Notifications & Permissions
  flutter_local_notifications: ^16.3.0
  permission_handler: ^11.1.0
  vibration: ^1.8.4
  
  # 🟢 Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
